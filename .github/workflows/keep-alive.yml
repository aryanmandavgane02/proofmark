# Keeps the free Supabase database awake (it pauses after a week without activity) and
# fails loudly if the live demo is down. Runs every day; can also be started by hand.
name: Keep alive
on:
  schedule:
    - cron: "30 3 * * *" # 09:00 IST
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the live demo and its database
        run: |
          for i in 1 2 3; do
            body=$(curl -s -w "\n%{http_code}" https://proofmark-flame.vercel.app/api/health) && code=$(echo "$body" | tail -1)
            echo "$body"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          exit 1
